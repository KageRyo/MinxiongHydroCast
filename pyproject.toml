[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minxiong-hydrocast"
version = "0.1.4"
description = "Official-source hydrometeorological data quality and reproducibility platform."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Chien-Hsun Chang" }
]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.9,<3",
  "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/KageRyo/MinxiongHydroCast"
Documentation = "https://github.com/KageRyo/MinxiongHydroCast/blob/main/docs/index.md"
Repository = "https://github.com/KageRyo/MinxiongHydroCast"
Issues = "https://github.com/KageRyo/MinxiongHydroCast/issues"
Changelog = "https://github.com/KageRyo/MinxiongHydroCast/blob/main/CHANGELOG.md"

[project.optional-dependencies]
scraper = [
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "playwright>=1.48",
]
report = [
  "pandas>=2.2",
  "python-docx>=1.1",
]
dev = [
  "build>=1.2",
  "coverage>=7.6",
  "pyright>=1.1",
  "pytest>=8.0",
  "ruff>=0.6",
]
model = [
  "scikit-learn>=1.5",
  "torch>=2.2",
]
all = [
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pandas>=2.2",
  "playwright>=1.48",
  "python-docx>=1.1",
  "scikit-learn>=1.5",
  "torch>=2.2",
]

[project.scripts]
mhc = "minxionghydrocast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minxionghydrocast = [
  "profiles/*.yaml",
  "profiles/boundaries/*.geojson",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ruff 0.16 expanded its implicit defaults. Keep the project's established correctness baseline
# explicit so tool upgrades do not silently change CI policy.
select = ["E4", "E7", "E9", "F"]
