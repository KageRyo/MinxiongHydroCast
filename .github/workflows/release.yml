name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out release
        uses: actions/checkout@v7

      - name: Verify release display name
        env:
          RELEASE_NAME: ${{ github.event.release.name }}
          EXPECTED_RELEASE_NAME: "MinxiongHydroCast ${{ github.event.release.tag_name }}"
        run: |
          test "$RELEASE_NAME" = "$EXPECTED_RELEASE_NAME"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install and smoke-test wheel
        env:
          MHC_EXPECTED_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install dist/*.whl
          python scripts/package_smoke.py

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/minxiong-hydrocast/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
