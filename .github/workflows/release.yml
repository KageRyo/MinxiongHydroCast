name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out release
        uses: actions/checkout@v7

      - name: Verify release display name
        env:
          RELEASE_NAME: ${{ github.event.release.name }}
          EXPECTED_RELEASE_NAME: "MinxiongHydroCast ${{ github.event.release.tag_name }}"
        run: |
          test "$RELEASE_NAME" = "$EXPECTED_RELEASE_NAME"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install and smoke-test wheel
        env:
          MHC_EXPECTED_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install dist/*.whl
          python scripts/package_smoke.py

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

      - name: Build and verify dataset protocol source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install --require-hashes "--only-binary=:all:" -r requirements-protocol.lock
          python scripts/protocol_archive.py build --output "protocol-dist/minxiong-hydrocast-protocol-${RELEASE_TAG}.tar.gz"
          python scripts/protocol_archive.py verify --archive "protocol-dist/minxiong-hydrocast-protocol-${RELEASE_TAG}.tar.gz" --extract-to "$RUNNER_TEMP/protocol-source"
          cd "$RUNNER_TEMP/protocol-source"
          python scripts/validate_public_contracts.py
          python -m pytest -q tests/test_public_contracts.py tests/test_event_splits.py tests/test_dataset_build.py tests/test_qpe_gauge_validation.py tests/test_radar_source_adapters.py tests/test_radar_tensor_conversion.py tests/test_tensor_baseline_evaluation.py
          cd "$GITHUB_WORKSPACE/protocol-dist"
          sha256sum ./*.tar.gz > SHA256SUMS

      - name: Upload verified protocol source
        uses: actions/upload-artifact@v7
        with:
          name: dataset-protocol-source
          path: protocol-dist/
          if-no-files-found: error

  publish-protocol:
    name: Attach verified protocol archive to release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dataset-protocol-source
          path: protocol-dist
      - name: Attach source archive and checksum inventory
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" ./protocol-dist/* --repo "$GITHUB_REPOSITORY"

  publish:
    name: Publish to PyPI
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/minxiong-hydrocast/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
