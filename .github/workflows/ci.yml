name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Compile Python files
        run: python -m compileall -q src tests scripts

      - name: Lint
        run: python -m ruff check .

      - name: Validate tracked public contracts
        run: python scripts/validate_public_contracts.py

      - name: Static type check
        run: >-
          python -m pyright -p pyrightconfig.json
          src/minxionghydrocast/pipelines/qpe_gauge_validation.py
          src/minxionghydrocast/models/rolling_backtest.py
          src/minxionghydrocast/pipelines/backtest_store.py
          src/minxionghydrocast/pipelines/rolling_backtest.py
          src/minxionghydrocast/research
          src/minxionghydrocast/pipelines/event_replay.py
          scripts/validate_public_contracts.py

      - name: Test with coverage
        run: python -m coverage run --source=src -m pytest -q

      - name: Report test coverage
        if: always()
        run: python -m coverage report

  package:
    name: Build and smoke-test wheel
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install wheel
        run: python -m pip install dist/*.whl

      - name: Smoke-test installed CLI and demo service
        run: python scripts/package_smoke.py

  protocol:
    name: Rebuild dataset protocol archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install source verification dependencies
        run: |
          python -m pip install --require-hashes "--only-binary=:all:" -r requirements-protocol.lock
          python -m pip install --no-deps --no-build-isolation .
      - name: Build, verify, and reconstruct synthetic data
        run: |
          python scripts/protocol_archive.py build --output "$RUNNER_TEMP/protocol.tar.gz"
          python scripts/protocol_archive.py verify --archive "$RUNNER_TEMP/protocol.tar.gz" --extract-to "$RUNNER_TEMP/protocol-source"
          cd "$RUNNER_TEMP/protocol-source"
          python scripts/validate_public_contracts.py
          python -m pytest -q tests/test_public_contracts.py tests/test_event_splits.py tests/test_dataset_build.py tests/test_qpe_gauge_validation.py tests/test_radar_source_adapters.py tests/test_radar_tensor_conversion.py tests/test_tensor_baseline_evaluation.py
      - name: Retain verified source archive
        uses: actions/upload-artifact@v7
        with:
          name: dataset-protocol-source
          path: ${{ runner.temp }}/protocol.tar.gz
          if-no-files-found: error
