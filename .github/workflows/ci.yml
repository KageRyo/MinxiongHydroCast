name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Compile Python files
        run: python -m compileall -q src tests scripts

      - name: Lint
        run: python -m ruff check .

      - name: Validate tracked public contracts
        run: python scripts/validate_public_contracts.py

      - name: Static type check
        run: >-
          python -m pyright -p pyrightconfig.json
          src/minxionghydrocast/pipelines/qpe_gauge_validation.py
          scripts/validate_public_contracts.py

      - name: Test with coverage
        run: python -m coverage run --source=src -m pytest -q

      - name: Report test coverage
        if: always()
        run: python -m coverage report

  package:
    name: Build and smoke-test wheel
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install wheel
        run: python -m pip install dist/*.whl

      - name: Smoke-test installed CLI and demo service
        run: python scripts/package_smoke.py
