<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="title desc">
  <title id="title">Minxiong operational working bounds</title>
  <desc id="desc">WGS84 rectangle from 120.38 to 120.52 longitude and 23.48 to 23.62 latitude. Based on the repository region profile. Not an authoritative administrative boundary or flood-risk map.</desc>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#cbdfe4" stroke-width="1"/></pattern></defs>
  <rect width="480" height="330" fill="#eef5f7"/>
  <rect x="40" y="20" width="400" height="280" fill="url(#grid)"/>
  <rect x="110" y="55" width="250" height="225" fill="#d6edf0" stroke="#086b83" stroke-width="2" stroke-dasharray="7 5"/>
  <path d="M110 55h20 M110 55v20 M360 55h-20 M360 55v20 M110 280h20 M110 280v-20 M360 280h-20 M360 280v-20" fill="none" stroke="#086b83" stroke-width="4"/>
  <g fill="#173443" font-family="sans-serif" text-anchor="middle">
    <text x="235" y="159" font-size="24" font-weight="700">民雄工作範圍</text>
    <text x="235" y="188" font-size="15">資料對齊參考</text>
    <text x="110" y="310" font-size="13">120.38° E</text>
    <text x="360" y="310" font-size="13">120.52° E</text>
    <text x="235" y="40" font-size="13">23.62° N</text>
    <text x="235" y="270" font-size="13">23.48° N</text>
  </g>
  <path d="M417 86V49m0 0-5 9m5-9 5 9" fill="none" stroke="#47616d" stroke-width="2"/>
  <text x="417" y="39" fill="#47616d" text-anchor="middle" font-family="sans-serif" font-size="13">N</text>
</svg>
